<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ef" />
    <title>恢复小阳的工作台</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; color: #262522; background: #f6f4ef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      main { width: min(420px, 100%); padding: 28px; border: 1px solid #e6e2db; border-radius: 8px; background: white; text-align: center; }
      span { width: 44px; height: 44px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 8px; color: white; background: #eb5831; font-size: 22px; }
      h1 { margin: 0; font-size: 21px; }
      p { margin: 10px 0 0; color: #77736d; font-size: 13px; line-height: 1.7; }
      button { min-height: 42px; margin-top: 20px; padding: 0 16px; border: 0; border-radius: 7px; color: white; background: #eb5831; font: inherit; font-weight: 650; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span>✓</span>
      <h1>正在恢复小阳的工作台</h1>
      <p id="status">正在移除旧页面缓存。学习、求职、饮品和 PDF 数据不会被删除。</p>
      <button id="retry" hidden>重新尝试</button>
    </main>
    <script>
      async function recover() {
        const status = document.querySelector('#status')
        const retry = document.querySelector('#retry')
        retry.hidden = true
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations()
            await Promise.all(registrations.map((registration) => registration.unregister()))
          }
          if ('caches' in window) {
            const names = await caches.keys()
            await Promise.all(names.map((name) => caches.delete(name)))
          }
          status.textContent = '恢复完成，正在重新打开工作台……'
          window.setTimeout(() => location.replace('./?recovered=' + Date.now()), 500)
        } catch (error) {
          status.textContent = '自动恢复没有完成，请点击按钮再试一次。个人数据仍然安全。'
          retry.hidden = false
        }
      }
      document.querySelector('#retry').addEventListener('click', recover)
      recover()
    </script>
  </body>
</html>
